apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting-ledger
  labels:
    app: accounting-ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounting-ledger
  template:
    metadata:
      labels:
        app: accounting-ledger
    spec:
      containers:
        - name: accounting-ledger
          image: accounting-ledger
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: APP_SIGNING_KEY
              value: "975b3ff06942cc911e0fb23576ae29466099648ba09f62450fbdbf4c9036a38d"
          volumeMounts:
            - mountPath: /workspace/config
              name: accounting-ledger-config-volume
          livenessProbe:
            httpGet:
              port: 8000
              path: /actuator/health/liveness
            initialDelaySeconds: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              port: 8000
              path: /actuator/health/readiness
            initialDelaySeconds: 40
            periodSeconds: 30
      volumes:
        - name: accounting-ledger-config-volume
          configMap:
            name: accounting-ledger-config